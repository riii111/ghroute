version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      # Failed writes to stdout or stderr cannot be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # Running gh and git with computed arguments is intended.
        - G204
        # Paths come from the user's own config, environment and PATH.
        - G304
        - G703
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/riii111/ghroute
